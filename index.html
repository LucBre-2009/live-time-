
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">

    <title>Berlin Clock</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #f5f7ff;
            background: #0b1020;
        }

        main {
            width: 100%;
            max-width: 700px;
            text-align: center;
        }

        .label {
            color: #8da2c9;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        h1 {
            margin: 18px 0 8px;
            font-size: clamp(56px, 13vw, 100px);
            font-weight: 700;
            letter-spacing: -4px;
            font-variant-numeric: tabular-nums;
        }

        #date {
            color: #b8c4dc;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .history {
            text-align: left;
            background: #131b30;
            border: 1px solid #26334f;
            border-radius: 16px;
            padding: 22px;
        }

        .history h2 {
            font-size: 17px;
            font-weight: 600;
            margin: 0 0 16px;
        }

        #history-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #history-list li {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #26334f;
            color: #b8c4dc;
            font-size: 14px;
        }

        #history-list li:first-child {
            color: #ffffff;
        }

        #history-list li:last-child {
            border-bottom: none;
        }

        .time {
            font-family: monospace;
            font-size: 16px;
            font-variant-numeric: tabular-nums;
        }

        footer {
            margin-top: 24px;
            color: #7182a4;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main>
        <div class="label">Berlin · Germany</div>

        <h1 id="clock">--:--:--</h1>

        <div id="date">Datum wird geladen …</div>

        <section class="history">
            <h2>Vergangene Uhrzeiten</h2>
            <ul id="history-list">
                <li>Warte auf die Uhrzeit …</li>
            </ul>
        </section>

        <footer>
            Zeitzone: Europe/Berlin · Aktualisierung jede Sekunde
        </footer>
    </main>

    <script>
        const timeFormatter = new Intl.DateTimeFormat("de-DE", {
            timeZone: "Europe/Berlin",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hourCycle: "h23"
        });

        const dateFormatter = new Intl.DateTimeFormat("de-DE", {
            timeZone: "Europe/Berlin",
            weekday: "long",
            day: "2-digit",
            month: "long",
            year: "numeric"
        });

        const clock = document.getElementById("clock");
        const date = document.getElementById("date");
        const historyList = document.getElementById("history-list");

        const history = [];
        const MAX_HISTORY = 10;

        function updateClock() {
            const now = new Date();

            const time = timeFormatter.format(now);
            const formattedDate = dateFormatter.format(now);

            // Große Uhrzeit und Browser-Tab aktualisieren
            clock.textContent = time;
            document.title = `${time} | Berlin`;

            // Datum anzeigen
            date.textContent = formattedDate;

            // Aktuelle Uhrzeit speichern
            history.unshift({
                time: time,
                date: formattedDate
            });

            // Nur die letzten 10 Sekunden behalten
            if (history.length > MAX_HISTORY) {
                history.pop();
            }

            // Verlauf anzeigen
            historyList.replaceChildren();

            history.forEach((entry, index) => {
                const item = document.createElement("li");

                const label = document.createElement("span");
                label.textContent =
                    index === 0 ? "Jetzt" :
                    index === 1 ? "Vor 1 Sekunde" :
                    `Vor ${index} Sekunden`;

                const value = document.createElement("span");
                value.className = "time";
                value.textContent = entry.time;

                item.append(label, value);
                historyList.appendChild(item);
            });
        }

        // Sofort starten und anschließend jede Sekunde aktualisieren
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
